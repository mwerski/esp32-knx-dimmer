; Partition-Bruecke: stellt einen ESP32-Solo per OTA auf eine neue Partitionstabelle um.
; Gleiche Plattform wie die Zielfirmware (Tasmota 2024.05.00, Einkern-Framework),
; damit Bruecke und Zielfirmware zum vorhandenen Bootloader passen.

[platformio]
default_envs = bruecke

[env:bruecke]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2024.05.00/platform-espressif32.zip
board = esp32-solo1
framework = arduino
monitor_speed = 115200
; nur fuer die Groessenpruefung beim Bauen; die Bruecke schreibt die Tabelle selbst
board_build.partitions = partitions/ziel.csv
build_flags =
  -DFRAMEWORK_ARDUINO_SOLO1
  -DCONFIG_FREERTOS_UNICORE=1
lib_deps =
  tzapu/WiFiManager @ 2.0.17

; Upload der Bruecke ueber das ArduinoOTA Ihrer bisherigen Firmware (statt ueber Tasmota)
[env:bruecke_espota]
extends = env:bruecke
upload_protocol = espota
upload_port = 192.168.1.227
